name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Storage and API suites - no browser needed
      - run: bun run test

      # Browser suite; skips by itself if this step is removed
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:ui
