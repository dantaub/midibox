<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidiBox</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>🎹 MidiBox</h1>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </header>

    <main>
        <div class="primary">
            <div class="card">
                <h2>Live Piano</h2>
                <div class="piano-container">
                    <div class="piano" id="piano"></div>
                </div>
            </div>

            <div class="card timeline-card">
                <div class="timeline-header">
                    <h2>Timeline</h2>
                    <div class="timeline-controls">
                        <button id="timelinePanLeft" class="btn-icon" title="Pan Left">⟵</button>
                        <button id="timelineZoomIn" class="btn-icon" title="Zoom In">＋</button>
                        <button id="timelineZoomOut" class="btn-icon" title="Zoom Out">－</button>
                        <button id="timelinePanRight" class="btn-icon" title="Pan Right">⟶</button>
                        <select id="timelineRange">
                            <option value="5">5 min</option>
                            <option value="15">15 min</option>
                            <option value="30" selected>30 min</option>
                            <option value="60">1 hour</option>
                            <option value="180">3 hours</option>
                        </select>
                        <button id="timelineRefresh" title="Refresh / Return to now">🔄</button>
                        <button id="timelinePlaySelection" class="btn-play" title="Play selection">▶</button>
                        <button id="timelineSaveNew" class="btn-save" title="Save as new session">💾</button>
                        <button id="timelineClear" title="Clear selection">✕</button>
                        <button id="timelineResumeAuto" class="btn-icon hidden" title="Resume auto-scroll">⏩</button>
                    </div>
                </div>
                <div class="timeline-container" id="timelineContainer">
                    <canvas class="timeline-canvas" id="timelineCanvas"></canvas>
                    <div class="timeline-selection" id="timelineSelection">
                        <div class="timeline-handle timeline-handle-left" id="handleLeft"></div>
                        <div class="timeline-handle timeline-handle-right" id="handleRight"></div>
                    </div>
                </div>
                <div class="timeline-info">
                    <span id="timelineStart">--:--</span>
                    <span class="timeline-selection-info" id="timelineSelectionInfo"></span>
                    <span id="timelineEnd">--:--</span>
                </div>
            </div>

            <div class="card flex-grow">
                <h2>Event Log</h2>
                <div class="event-log" id="eventLog"></div>
            </div>
        </div>

        <div class="sidebar">
            <div class="card">
                <h2 id="sessionFormTitle">New Session</h2>
                <form class="session-form" id="sessionForm">
                    <input type="hidden" name="id" value="">
                    <input type="text" name="performer" placeholder="Performer name">
                    <input type="text" name="song" placeholder="Song name">
                    <div class="session-time-row">
                        <label for="sessionStart">Start:</label>
                        <input type="number" name="sessionStart" id="sessionStart" min="0" step="1">
                        <label for="sessionEnd">End:</label>
                        <input type="number" name="sessionEnd" id="sessionEnd" min="0" step="1">
                    </div>
                    <div class="session-form-buttons">
                        <button type="submit" class="btn btn-primary" id="btnSaveSession">Save New</button>
                        <button type="button" class="btn btn-secondary hidden" id="btnUpdateSession">Update</button>
                        <button type="button" class="btn btn-stop hidden" id="btnDeleteSession">Delete</button>
                        <button type="button" class="btn btn-secondary hidden" id="btnCancelEdit">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <h2>Sessions</h2>
                <div class="session-list" id="sessionList"></div>
            </div>

            <div class="card">
                <h2>Playback</h2>
                <div class="controls">
                    <div class="control-row">
                        <label class="control-label">Output:</label>
                        <select id="outputSelect">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="control-row">
                        <button class="btn btn-primary" id="btnPlayback">▶ Play</button>
                        <button class="btn btn-stop" id="btnStop" disabled>⏹ Stop</button>
                    </div>
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-text" id="progressText">0%</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>MIDI File</h2>
                <div class="controls">
                    <input type="file" id="midiFileInput" accept=".mid,.midi" hidden>
                    <button class="btn btn-secondary" id="btnSelectFile">📁 Select File</button>
                    <div id="fileInfo" class="file-info"></div>
                    <button class="btn btn-primary btn-file-play" id="btnPlayFile" disabled>▶ Play File</button>
                </div>
            </div>

            <div class="card">
                <h2>MIDI</h2>
                <div class="controls">
                    <button class="btn btn-secondary" id="btnRefresh">Refresh Devices</button>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
