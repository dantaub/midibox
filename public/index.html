<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidiBox</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>MidiBox</h1>
        <nav class="tabs" id="tabs">
            <button class="tab active" data-view="live">Live</button>
            <button class="tab" data-view="history">History</button>
        </nav>
        <div class="header-right">
            <div class="header-control">
                <button class="btn-icon btn-log-toggle" id="btnToggleEventLog" title="Toggle event log window">&#x2630; Log</button>
                <button class="btn-icon btn-live-toggle" id="btnLiveToggle" title="Follow live (Home)">&#x25B6; Live</button>
                <button class="btn-icon" id="timelineRefresh" title="Reload the timeline">&#x21BB;</button>
            </div>
            <div class="header-control">
                <button class="btn-connect" id="btnConnectOut" title="Open the selected MIDI output">&#x1F50C; Connect Out</button>
                <span class="out-status" id="outStatus"></span>
            </div>
            <div class="header-control">
                <span class="header-label">Thru</span>
                <label class="toggle">
                    <input type="checkbox" id="thruToggle">
                    <span class="toggle-slider"></span>
                </label>
                <span class="thru-status" id="thruStatus">Off</span>
            </div>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </div>
    </header>

    <main class="view" id="viewLive">
        <div class="primary">
            <div class="card timeline-card">
                <div class="piano-container">
                    <div class="piano" id="piano"></div>
                </div>

                <div class="timeline-container" id="timelineContainer">
                    <canvas class="timeline-canvas" id="timelineCanvas"></canvas>
                    <div class="timeline-selection" id="timelineSelection">
                        <div class="timeline-handle timeline-handle-left" id="handleLeft"></div>
                        <div class="timeline-handle timeline-handle-right" id="handleRight"></div>
                    </div>
                </div>

                <div class="timeline-info">
                    <span id="timelineStart">--:--</span>
                    <span class="timeline-selection-info" id="timelineSelectionInfo"></span>
                    <span id="timelineEnd">--:--</span>
                </div>

                <div class="timeline-controls">
                    <button id="timelinePanLeft" class="btn-icon" title="Earlier (Arrow Up)">&#x2191;</button>
                    <button id="timelineZoomIn" class="btn-icon" title="Zoom In (+)">+</button>
                    <button id="timelineZoomOut" class="btn-icon" title="Zoom Out (-)">-</button>
                    <button id="timelinePanRight" class="btn-icon" title="Later (Arrow Down)">&#x2193;</button>
                    <span class="timeline-separator">|</span>
                    <button id="timelinePlaySelection" class="btn-play" title="Play selection (Space)" disabled>&#x25B6;</button>
                    <button id="timelineStop" class="btn-stop-small" title="Stop (Esc)" disabled>&#x23F9;</button>
                    <button id="timelineSaveNew" class="btn-save" title="Save selection as session" disabled>&#x1F4BE;</button>
                    <button id="timelineClear" class="btn-icon" title="Clear selection (Esc)" disabled>&#x2715;</button>
                    <span class="timeline-separator">|</span>
                    <button id="timelineFlip" class="btn-icon" title="Flip timeline direction">&#x21C5;</button>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="card">
                <h2>Recording Bank</h2>
                <div class="controls">
                    <div class="control-row">
                        <label class="control-label" for="bankSelect">Bank:</label>
                        <select id="bankSelect">
                            <option value="">All (untagged)</option>
                        </select>
                    </div>
                    <div class="bank-hint" id="bankHint">Incoming notes are not tagged.</div>
                </div>
            </div>

            <!-- Session Edit Panel (shown when editing) -->
            <div class="card edit-panel hidden" id="editPanel">
                <h2>Edit Session</h2>
                <div class="edit-time-info" id="editTimeInfo"></div>
                <input type="text" id="editPerformer" placeholder="Performer name">
                <input type="text" id="editSong" placeholder="Song name">
                <div class="edit-buttons">
                    <button class="btn btn-primary" id="btnEditSave">Save</button>
                    <button class="btn btn-secondary" id="btnEditCancel">Cancel</button>
                    <button class="btn btn-stop" id="btnEditDelete">Delete</button>
                </div>
            </div>

            <div class="card">
                <h2>Sessions</h2>
                <div class="session-list" id="sessionList"></div>
            </div>

            <div class="card">
                <h2>Playback</h2>
                <div class="controls">
                    <div class="control-row">
                        <label class="control-label">Output:</label>
                        <select id="outputSelect">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="control-row">
                        <button class="btn btn-primary" id="btnPlayback">&#x25B6; Play</button>
                        <button class="btn btn-stop" id="btnStop" disabled>&#x23F9; Stop</button>
                    </div>
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-text" id="progressText">0%</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>MIDI File</h2>
                <div class="controls">
                    <input type="file" id="midiFileInput" accept=".mid,.midi" hidden>
                    <button class="btn btn-secondary" id="btnSelectFile">Select File</button>
                    <div id="fileInfo" class="file-info"></div>
                    <button class="btn btn-primary btn-file-play" id="btnPlayFile" disabled>&#x25B6; Play File</button>
                </div>
            </div>

            <div class="card">
                <h2>MIDI Devices</h2>
                <div class="controls">
                    <button class="btn btn-secondary" id="btnRefresh">Refresh</button>
                </div>
            </div>
        </div>
    </main>

    <!-- History tab: recorded activity by date -->
    <section class="view history-view hidden" id="viewHistory">
        <aside class="card history-days-card">
            <div class="history-toolbar">
                <select id="historyBankFilter" title="Filter by bank">
                    <option value="all">All banks</option>
                </select>
                <select id="historyGap" title="Split activity when silence exceeds">
                    <option value="30000">30s gaps</option>
                    <option value="60000" selected>1m gaps</option>
                    <option value="300000">5m gaps</option>
                    <option value="900000">15m gaps</option>
                </select>
                <button class="btn-icon" id="historyRefresh" title="Refresh">&#x21BB;</button>
            </div>
            <div class="day-list" id="dayList">
                <div class="history-empty">Loading&hellip;</div>
            </div>
        </aside>

        <div class="history-main">
            <div class="card history-segments-card">
                <div class="history-header">
                    <h2 id="historyDayTitle">Select a day</h2>
                    <span class="live-pill hidden" id="historyLivePill">&#x25CF; LIVE</span>
                    <span class="history-day-stats" id="historyDayStats"></span>
                </div>
                <div class="segment-list" id="segmentList">
                    <div class="history-empty">Pick a date to see recorded activity.</div>
                </div>
            </div>

            <div class="card history-preview-card">
                <div class="history-header">
                    <h2 id="historyPreviewTitle">Preview</h2>
                    <div class="history-preview-actions">
                        <button class="btn btn-primary" id="historyPlay" disabled>&#x25B6; Play</button>
                        <button class="btn btn-stop" id="historyStop" disabled>&#x23F9; Stop</button>
                        <button class="btn btn-secondary" id="historySave" disabled>&#x1F4BE; Save</button>
                    </div>
                </div>
                <div class="history-save-form hidden" id="historySaveForm">
                    <input type="text" id="historySaveSong" placeholder="Song name">
                    <input type="text" id="historySavePerformer" placeholder="Performer">
                    <select id="historySaveBank" title="Bank tag"></select>
                    <button class="btn btn-primary" id="historySaveConfirm">Save session</button>
                    <button class="btn btn-secondary" id="historySaveCancel">Cancel</button>
                </div>
                <div class="history-canvas-wrap" id="historyCanvasWrap">
                    <canvas id="historyCanvas"></canvas>
                </div>
                <div class="history-preview-info" id="historyPreviewInfo">Select a stretch of activity to preview it.</div>
            </div>
        </div>
    </section>

    <!-- Floating event log window (toggled from the header) -->
    <div class="floating-panel hidden" id="eventLogPanel">
        <div class="floating-panel-header" id="eventLogHeader">
            <span class="floating-panel-title">Event Log</span>
            <button class="floating-panel-close" id="eventLogClose" title="Close">&#x2715;</button>
        </div>
        <div class="event-log" id="eventLog"></div>
    </div>

    <!-- Legacy form elements (hidden, for backwards compatibility) -->
    <form id="sessionForm" class="hidden">
        <input type="hidden" name="id" value="">
        <input type="hidden" name="performer">
        <input type="hidden" name="song">
        <input type="hidden" id="sessionStart">
        <input type="hidden" id="sessionEnd">
    </form>
    <div class="hidden">
        <span id="sessionFormTitle"></span>
        <button id="btnSaveSession"></button>
        <button id="btnUpdateSession"></button>
        <button id="btnDeleteSession"></button>
        <button id="btnCancelEdit"></button>
    </div>

    <script src="app.js"></script>
    <script src="history.js"></script>
</body>

</html>
