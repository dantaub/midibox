<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidiBox</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }

        header {
            background: #16213e;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e94560;
        }

        h1 {
            font-size: 1.5rem;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.connected {
            background: #4caf50;
        }

        .status-dot.recording {
            background: #e94560;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        main {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            padding: 1rem;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        @media (min-width: 900px) {
            main {
                grid-template-columns: 1fr 320px;
            }
        }

        .primary {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-height: 0;
            overflow: hidden;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
        }

        .card {
            background: #16213e;
            border-radius: 8px;
            padding: 1rem;
            flex-shrink: 0;
        }

        .card.flex-grow {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .card h2 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: #e94560;
        }

        /* Piano visualization */
        .piano-container {
            overflow-x: auto;
            padding: 0.5rem 0;
        }

        .piano {
            display: flex;
            position: relative;
            height: 100px;
        }

        .white-key {
            width: 18px;
            min-width: 18px;
            height: 100%;
            background: linear-gradient(to bottom, #fff 0%, #e8e8e8 100%);
            border: 1px solid #999;
            border-radius: 0 0 3px 3px;
            transition: background 0.1s;
            cursor: pointer;
            user-select: none;
        }

        .white-key.active {
            background: linear-gradient(to bottom, #e94560 0%, #c73e54 100%);
        }

        .black-key {
            position: absolute;
            width: 12px;
            height: 60px;
            background: linear-gradient(to bottom, #333 0%, #000 100%);
            border-radius: 0 0 2px 2px;
            z-index: 1;
            transition: background 0.1s;
            cursor: pointer;
            user-select: none;
        }

        .black-key.active {
            background: linear-gradient(to bottom, #e94560 0%, #a83248 100%);
        }

        /* Event log */
        .event-log {
            flex: 1;
            overflow-y: auto;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.8rem;
        }

        .event {
            padding: 0.2rem 0.5rem;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            gap: 0.75rem;
        }

        .event-time {
            color: #666;
            min-width: 80px;
        }

        .event-type {
            color: #e94560;
            min-width: 70px;
        }

        .event-note {
            color: #4caf50;
        }

        .event-vel {
            color: #2196f3;
        }

        /* Sessions panel */
        .session-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .session-form input {
            padding: 0.5rem;
            border: none;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
        }

        .session-form input[type="hidden"] {
            display: none;
        }

        .session-form-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .session-form-buttons .btn {
            flex: 1;
            min-width: 70px;
            padding: 0.5rem;
            font-size: 0.85rem;
        }

        .session-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .session-item {
            padding: 0.5rem;
            background: #1a1a2e;
            border-radius: 4px;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }

        .session-item:hover {
            background: #252550;
        }

        .session-item.selected {
            background: #e94560;
        }

        .session-item .title {
            font-weight: bold;
        }

        .session-item .meta {
            font-size: 0.8rem;
            color: #888;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            flex-direction: column;
        }

        .control-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: #e94560;
            color: white;
        }

        .btn-secondary {
            background: #333;
            color: white;
        }

        .btn-stop {
            background: #ff6b6b;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        select {
            padding: 0.5rem;
            border: none;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
            flex: 1;
        }

        /* Progress bar */
        .progress-container {
            margin-top: 0.75rem;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            height: 8px;
            background: #1a1a2e;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #4caf50);
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-text {
            font-size: 0.75rem;
            color: #888;
            margin-top: 0.25rem;
            text-align: center;
        }

        /* Playback indicator on piano */
        .white-key.playback {
            background: linear-gradient(to bottom, #4caf50 0%, #388e3c 100%);
        }

        .black-key.playback {
            background: linear-gradient(to bottom, #4caf50 0%, #2e7d32 100%);
        }

        /* Timeline / Piano Roll */
        .timeline-card {
            flex: 1;
            min-height: 120px;
            max-height: 200px;
            display: flex;
            flex-direction: column;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .timeline-header h2 {
            margin-bottom: 0;
        }

        .timeline-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .timeline-controls button {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            border: none;
            border-radius: 3px;
            background: #1a1a2e;
            color: #888;
            cursor: pointer;
        }

        .timeline-controls button:hover {
            background: #252550;
            color: #fff;
        }

        .timeline-controls select {
            padding: 0.25rem;
            font-size: 0.75rem;
            border: none;
            border-radius: 3px;
            background: #1a1a2e;
            color: #888;
        }

        .timeline-container {
            flex: 1;
            position: relative;
            background: #0d1117;
            border-radius: 4px;
            overflow: hidden;
            cursor: crosshair;
        }

        .timeline-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .timeline-selection {
            position: absolute;
            top: 0;
            bottom: 0;
            background: rgba(233, 69, 96, 0.3);
            border-left: 2px solid #e94560;
            border-right: 2px solid #e94560;
            pointer-events: none;
            display: none;
        }

        .timeline-selection.active {
            display: block;
        }

        .timeline-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 10px;
            cursor: ew-resize;
            pointer-events: auto;
        }

        .timeline-handle-left {
            left: -5px;
        }

        .timeline-handle-right {
            right: -5px;
        }

        .timeline-handle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 30px;
            background: #e94560;
            border-radius: 2px;
        }

        .timeline-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #666;
            margin-top: 0.25rem;
        }

        .timeline-selection-info {
            color: #e94560;
        }
    </style>
</head>

<body>
    <header>
        <h1>🎹 MidiBox</h1>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </header>

    <main>
        <div class="primary">
            <div class="card">
                <h2>Live Piano</h2>
                <div class="piano-container">
                    <div class="piano" id="piano"></div>
                </div>
            </div>

            <div class="card timeline-card">
                <div class="timeline-header">
                    <h2>Timeline</h2>
                    <div class="timeline-controls">
                        <button id="timelinePanLeft" title="Pan Left" style="font-size:1.2em;">⟵</button>
                        <button id="timelineZoomIn" title="Zoom In" style="font-size:1.2em;">＋</button>
                        <button id="timelineZoomOut" title="Zoom Out" style="font-size:1.2em;">－</button>
                        <button id="timelinePanRight" title="Pan Right" style="font-size:1.2em;">⟶</button>
                        <select id="timelineRange">
                            <option value="5">5 min</option>
                            <option value="15">15 min</option>
                            <option value="30" selected>30 min</option>
                            <option value="60">1 hour</option>
                            <option value="180">3 hours</option>
                        </select>
                        <button id="timelineRefresh" title="Refresh / Return to now">🔄</button>
                        <button id="timelinePlaySelection" title="Play selection" style="background: #2a5a3a;">▶</button>
                        <button id="timelineSaveNew" title="Save as new session" style="background: #2a3a5a;">💾</button>
                        <button id="timelineClear" title="Clear selection">✕</button>
                        <button id="timelineResumeAuto" title="Resume auto-scroll" style="font-size:1.2em; display:none;">⏩</button>
                    </div>
                </div>
                <div class="timeline-container" id="timelineContainer">
                    <canvas class="timeline-canvas" id="timelineCanvas"></canvas>
                    <div class="timeline-selection" id="timelineSelection">
                        <div class="timeline-handle timeline-handle-left" id="handleLeft"></div>
                        <div class="timeline-handle timeline-handle-right" id="handleRight"></div>
                    </div>
                </div>
                <div class="timeline-info">
                    <span id="timelineStart">--:--</span>
                    <span class="timeline-selection-info" id="timelineSelectionInfo"></span>
                    <span id="timelineEnd">--:--</span>
                </div>
            </div>

            <div class="card flex-grow">
                <h2>Event Log</h2>
                <div class="event-log" id="eventLog"></div>
            </div>
        </div>

        <div class="sidebar">
            <div class="card">
                <h2 id="sessionFormTitle">New Session</h2>
                <form class="session-form" id="sessionForm">
                    <input type="hidden" name="id" value="">
                    <input type="text" name="performer" placeholder="Performer name">
                    <input type="text" name="song" placeholder="Song name">
                    <div style="display: flex; gap: 0.5em; align-items: center; margin-bottom: 0.5em;">
                        <label for="sessionStart" style="font-size: 0.9em;">Start:</label>
                        <input type="number" name="sessionStart" id="sessionStart" min="0" step="1" style="width:7em;">
                        <label for="sessionEnd" style="font-size: 0.9em;">End:</label>
                        <input type="number" name="sessionEnd" id="sessionEnd" min="0" step="1" style="width:7em;">
                    </div>
                    <div class="session-form-buttons">
                        <button type="submit" class="btn btn-primary" id="btnSaveSession">Save New</button>
                        <button type="button" class="btn btn-secondary" id="btnUpdateSession" style="display: none;">Update</button>
                        <button type="button" class="btn btn-stop" id="btnDeleteSession" style="display: none;">Delete</button>
                        <button type="button" class="btn btn-secondary" id="btnCancelEdit" style="display: none;">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <h2>Sessions</h2>
                <div class="session-list" id="sessionList"></div>
            </div>

            <div class="card">
                <h2>Playback</h2>
                <div class="controls">
                    <div class="control-row">
                        <label style="font-size: 0.85rem; color: #888;">Output:</label>
                        <select id="outputSelect">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="control-row">
                        <button class="btn btn-primary" id="btnPlayback">▶ Play</button>
                        <button class="btn btn-stop" id="btnStop" disabled>⏹ Stop</button>
                    </div>
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-text" id="progressText">0%</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>MIDI File</h2>
                <div class="controls">
                    <input type="file" id="midiFileInput" accept=".mid,.midi" style="display: none;">
                    <button class="btn btn-secondary" id="btnSelectFile">📁 Select File</button>
                    <div id="fileInfo" style="font-size: 0.85rem; color: #888; margin-top: 0.5rem;"></div>
                    <button class="btn btn-primary" id="btnPlayFile" disabled style="margin-top: 0.5rem;">▶ Play File</button>
                </div>
            </div>

            <div class="card">
                <h2>MIDI</h2>
                <div class="controls">
                    <button class="btn btn-secondary" id="btnRefresh">Refresh Devices</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Piano keyboard setup
        const piano = document.getElementById('piano')
        const eventLog = document.getElementById('eventLog')
        const statusDot = document.getElementById('statusDot')
        const statusText = document.getElementById('statusText')

        // Note names for display
        const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B']
        const blackKeyOffsets = [1, 2, 4, 5, 6] // Which white keys have black keys after them (0-indexed within octave)

        function noteName(note) {
            const octave = Math.floor(note / 12) - 1
            const name = noteNames[note % 12]
            return `${name}${octave}`
        }

                // Build piano - full 88-key range (A0 to C8)
                const startNote = 21 // A0 (lowest on 88-key piano)
                const endNote = 108  // C8 (highest on 88-key piano)
        const keys = {}

        let whiteKeyIndex = 0
        for (let note = startNote; note <= endNote; note++) {
            const noteInOctave = note % 12
            const isBlack = [1, 3, 6, 8, 10].includes(noteInOctave)

            const key = document.createElement('div')
            key.dataset.note = note

            if (isBlack) {
                key.className = 'black-key'
                key.style.left = `${(whiteKeyIndex * 18) - 6}px`
            } else {
                key.className = 'white-key'
                whiteKeyIndex++
            }

            keys[note] = key
            piano.appendChild(key)
        }

                // Click/touch to play notes
                const pressedKeys = new Set()

                function sendNoteOn(note) {
                    if (ws && ws.readyState === WebSocket.OPEN && !pressedKeys.has(note)) {
                        pressedKeys.add(note)
                        ws.send(JSON.stringify({ type: 'playNote', note, velocity: 100, on: true }))
                        activateNote(note)
                    }
                }

                function sendNoteOff(note) {
                    if (ws && ws.readyState === WebSocket.OPEN && pressedKeys.has(note)) {
                        pressedKeys.delete(note)
                        ws.send(JSON.stringify({ type: 'playNote', note, on: false }))
                        deactivateNote(note)
                    }
                }

                // Mouse handlers
                piano.addEventListener('mousedown', (e) => {
                    const key = e.target.closest('.white-key, .black-key')
                    if (key) {
                        e.preventDefault()
                        sendNoteOn(parseInt(key.dataset.note))
                    }
                })

                document.addEventListener('mouseup', () => {
                    pressedKeys.forEach(note => sendNoteOff(note))
                })

                piano.addEventListener('mouseleave', () => {
                    pressedKeys.forEach(note => sendNoteOff(note))
                })

                piano.addEventListener('mouseover', (e) => {
                    if (e.buttons === 1) {
                        const key = e.target.closest('.white-key, .black-key')
                        if (key) {
                            const note = parseInt(key.dataset.note)
                            // Release other keys when dragging
                            pressedKeys.forEach(n => { if (n !== note) sendNoteOff(n) })
                            sendNoteOn(note)
                        }
                    }
                })

                // Touch handlers for mobile
                piano.addEventListener('touchstart', (e) => {
                    e.preventDefault()
                    for (const touch of e.changedTouches) {
                        const key = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.white-key, .black-key')
                        if (key) sendNoteOn(parseInt(key.dataset.note))
                    }
                }, { passive: false })

                piano.addEventListener('touchend', (e) => {
                    e.preventDefault()
                    for (const touch of e.changedTouches) {
                        const key = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.white-key, .black-key')
                        if (key) sendNoteOff(parseInt(key.dataset.note))
                    }
                }, { passive: false })

                piano.addEventListener('touchmove', (e) => {
                    e.preventDefault()
                    const currentNotes = new Set()
                    for (const touch of e.touches) {
                        const key = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.white-key, .black-key')
                        if (key) currentNotes.add(parseInt(key.dataset.note))
                    }
                    // Release notes no longer touched
                    pressedKeys.forEach(note => { if (!currentNotes.has(note)) sendNoteOff(note) })
                    // Press new notes
                    currentNotes.forEach(note => sendNoteOn(note))
                }, { passive: false })

        // Active notes tracking
        const activeNotes = new Set()
        let isPlaying = false
        const playbackNotes = new Set()

        function activateNote(note, isPlayback = false) {
            if (keys[note]) {
                if (isPlayback) {
                    keys[note].classList.add('playback')
                    playbackNotes.add(note)
                } else {
                    keys[note].classList.add('active')
                    activeNotes.add(note)
                }
            }
        }

        function deactivateNote(note, isPlayback = false) {
            if (keys[note]) {
                if (isPlayback) {
                    keys[note].classList.remove('playback')
                    playbackNotes.delete(note)
                } else {
                    keys[note].classList.remove('active')
                    activeNotes.delete(note)
                }
            }
        }

        function clearPlaybackNotes() {
            playbackNotes.forEach(note => {
                if (keys[note]) keys[note].classList.remove('playback')
            })
            playbackNotes.clear()
        }

        // Event log
        const maxLogEntries = 100

        function addLogEntry(event) {
            const entry = document.createElement('div')
            entry.className = 'event'

            const time = new Date(event.timestamp).toLocaleTimeString()
            let details = ''

            if (event.type === 'noteon' || event.type === 'noteoff') {
                details = `<span class="event-note">${noteName(event.note)}</span> <span class="event-vel">vel:${event.velocity}</span>`
            } else if (event.type === 'cc') {
                details = `CC${event.control} = ${event.value}`
            } else if (event.type === 'pitchbend') {
                details = `bend: ${event.value}`
            }

            entry.innerHTML = `
        <span class="event-time">${time}</span>
        <span class="event-type">${event.type}</span>
        ${details}
      `

            eventLog.insertBefore(entry, eventLog.firstChild)

            // Trim old entries
            while (eventLog.children.length > maxLogEntries) {
                eventLog.removeChild(eventLog.lastChild)
            }
        }

                            // --- Timeline / Piano Roll ---
                            const timelineCanvas = document.getElementById('timelineCanvas')
                            const timelineContainer = document.getElementById('timelineContainer')
                            const timelineSelection = document.getElementById('timelineSelection')
                            const timelineRange = document.getElementById('timelineRange')
                            const timelineStart = document.getElementById('timelineStart')
                            const timelineEnd = document.getElementById('timelineEnd')
                            const timelineSelectionInfo = document.getElementById('timelineSelectionInfo')
                            const ctx = timelineCanvas.getContext('2d')
                            let timelineEvents = []
                            let timelineStartTime = 0
                            let timelineEndTime = 0
                            let selectionStart = null
                            let selectionEnd = null
                            let isDragging = false
                            let playbackActive = false
                            let playbackTime = null
                            let viewingSession = false
                            const minNote = 21
                            const maxNote = 108
                            const noteRange = maxNote - minNote + 1

                            // Fetch timeline data for a given range
                            async function fetchTimelineEvents(start, end) {
                                try {
                                    const res = await fetch(`/api/events/range?start=${start}&end=${end}`)
                                    timelineEvents = await res.json()
                                    drawTimeline()
                                } catch (err) {
                                    console.error('Failed to fetch timeline data:', err)
                                }
                            }

                            // Ensure timelineEvents covers the given range
                            async function ensureTimelineDataCovers(start, end) {
                                if (timelineEvents.length > 0 && timelineEvents[0].timestamp <= start && timelineEvents[timelineEvents.length - 1].timestamp >= end) return
                                await fetchTimelineEvents(start, end)
                            }

                            function resizeCanvas() {
                                const rect = timelineContainer.getBoundingClientRect()
                                const dpr = window.devicePixelRatio || 1
                                timelineCanvas.width = rect.width * dpr
                                timelineCanvas.height = rect.height * dpr
                                timelineCanvas.style.width = rect.width + 'px'
                                timelineCanvas.style.height = rect.height + 'px'
                                ctx.setTransform(1, 0, 0, 1, 0, 0)
                                ctx.scale(dpr, dpr)
                                drawTimeline()
                            }

                            async function loadTimelineData() {
                                const minutes = parseInt(timelineRange.value)
                                const now = Date.now()
                                timelineEndTime = now
                                timelineStartTime = now - minutes * 60 * 1000
                                await fetchTimelineEvents(timelineStartTime, timelineEndTime)
                                updateTimeLabels()
                                drawTimeline()
                            }

                            function updateTimeLabels() {
                                timelineStart.textContent = new Date(timelineStartTime).toLocaleTimeString()
                                timelineEnd.textContent = new Date(timelineEndTime).toLocaleTimeString()
                            }

                            function drawTimeline() {
                                const width = timelineContainer.clientWidth
                                const height = timelineContainer.clientHeight
                                const duration = timelineEndTime - timelineStartTime
                                ctx.clearRect(0, 0, width, height)
                                // Draw background grid (pitch lines)
                                ctx.strokeStyle = '#1a1a2e'
                                ctx.lineWidth = 1
                                for (let i = 0; i <= 12; i++) {
                                    const y = (i / 12) * height
                                    ctx.beginPath()
                                    ctx.moveTo(0, y)
                                    ctx.lineTo(width, y)
                                    ctx.stroke()
                                }
                                // Draw time grid (vertical lines every minute)
                                ctx.strokeStyle = '#252550'
                                const minuteMs = 60 * 1000
                                const startMinute = Math.ceil(timelineStartTime / minuteMs) * minuteMs
                                for (let t = startMinute; t < timelineEndTime; t += minuteMs) {
                                    const x = ((t - timelineStartTime) / duration) * width
                                    ctx.beginPath()
                                    ctx.moveTo(x, 0)
                                    ctx.lineTo(x, height)
                                    ctx.stroke()
                                }
                                // Build note on/off pairs for drawing bars
                                const activeNotes = new Map()
                                const noteBars = []
                                for (const event of timelineEvents) {
                                    if (event.type === 'noteon' && event.velocity > 0) {
                                        activeNotes.set(event.note, { start: event.timestamp, velocity: event.velocity })
                                    } else if (event.type === 'noteoff' || (event.type === 'noteon' && event.velocity === 0)) {
                                        const noteStart = activeNotes.get(event.note)
                                        if (noteStart) {
                                            noteBars.push({
                                                note: event.note,
                                                start: noteStart.start,
                                                end: event.timestamp,
                                                velocity: noteStart.velocity
                                            })
                                            activeNotes.delete(event.note)
                                        }
                                    }
                                }
                                for (const [note, data] of activeNotes) {
                                    noteBars.push({ note, start: data.start, end: timelineEndTime, velocity: data.velocity })
                                }
                                // Draw note bars
                                const noteHeight = height / noteRange
                                for (const bar of noteBars) {
                                    const x1 = ((bar.start - timelineStartTime) / duration) * width
                                    const x2 = ((bar.end - timelineStartTime) / duration) * width
                                    const y = height - ((bar.note - minNote + 1) / noteRange) * height
                                    const brightness = 50 + (bar.velocity / 127) * 50
                                    const isBlack = [1, 3, 6, 8, 10].includes(bar.note % 12)
                                    ctx.fillStyle = isBlack ? `hsl(340, 80%, ${brightness}%)` : `hsl(160, 70%, ${brightness}%)`
                                    const barWidth = Math.max(2, x2 - x1)
                                    ctx.fillRect(x1, y, barWidth, Math.max(1, noteHeight - 1))
                                }
                                // Draw selection overlay
                                if (selectionStart !== null && selectionEnd !== null) {
                                    const selX1 = ((Math.min(selectionStart, selectionEnd) - timelineStartTime) / duration) * width
                                    const selX2 = ((Math.max(selectionStart, selectionEnd) - timelineStartTime) / duration) * width
                                    ctx.save()
                                    ctx.globalAlpha = 0.3
                                    ctx.fillStyle = '#e94560'
                                    ctx.fillRect(selX1, 0, selX2 - selX1, height)
                                    ctx.restore()
                                }
                                // Draw playback line
                                if (playbackActive && playbackTime != null) {
                                    const x = ((playbackTime - timelineStartTime) / duration) * width
                                    if (x >= 0 && x <= width) {
                                        ctx.save()
                                        ctx.strokeStyle = '#FFD700'
                                        ctx.lineWidth = 3
                                        ctx.beginPath()
                                        ctx.moveTo(x, 0)
                                        ctx.lineTo(x, height)
                                        ctx.stroke()
                                        ctx.restore()
                                    }
                                }
                            }

        // WebSocket connection
        let ws
        let reconnectTimeout
            let reconnectAttempts = 0
            const maxReconnectDelay = 30000 // Max 30 seconds between attempts

        function connect() {
            // Clear any existing timeout
            clearTimeout(reconnectTimeout)

            // Close existing connection if any
            if (ws) {
                ws.onclose = null // Prevent triggering reconnect
                ws.close()
            }

            statusDot.className = 'status-dot'
            statusText.textContent = 'Connecting...'

            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'
            ws = new WebSocket(`${protocol}//${location.host}/ws`)

            ws.onopen = () => {
                statusDot.className = 'status-dot connected recording'
                statusText.textContent = 'Recording'
                reconnectAttempts = 0 // Reset on successful connection
            }

            ws.onclose = () => {
                statusDot.className = 'status-dot'
                // Exponential backoff: 1s, 2s, 4s, 8s... up to maxReconnectDelay
                const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), maxReconnectDelay)
                reconnectAttempts++
                statusText.textContent = `Reconnecting in ${Math.round(delay / 1000)}s...`
                reconnectTimeout = setTimeout(connect, delay)
            }

            ws.onerror = () => {
                // Error will trigger onclose, which handles reconnection
            }

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data)
                    if (data.type === 'midi') {
                        handleMidiEvent(data.event)
                    } else if (data.type === 'playback') {
                        handlePlaybackStatus(data)
                    } else if (data.type === 'playback-event') {
                        handlePlaybackEvent(data)
                    }
                } catch (err) {
                    console.error('WebSocket message error:', err)
                }
            }
        }

        function handleMidiEvent(event) {
            // Update piano visualization
            if (event.type === 'noteon' && event.velocity > 0) {
                activateNote(event.note, false)
            } else if (event.type === 'noteoff' || (event.type === 'noteon' && event.velocity === 0)) {
                deactivateNote(event.note, false)
            }

            // Add to log
            addLogEntry(event)

            // Add to timeline
            addEventToTimeline(event)
        }

        function handlePlaybackStatus(data) {
            const progressContainer = document.getElementById('progressContainer')
            const btnPlayback = document.getElementById('btnPlayback')
            const btnStop = document.getElementById('btnStop')

            if (data.status === 'started') {
                isPlaying = true
                progressContainer.classList.add('active')
                btnPlayback.disabled = true
                btnStop.disabled = false
            } else if (data.status === 'ended') {
                isPlaying = false
                progressContainer.classList.remove('active')
                btnPlayback.disabled = false

                clearPlaybackNotes()
                document.getElementById('progressFill').style.width = '0%'

        function handlePlaybackEvent(data) {
            const event = data.event
            const progress = data.progress

            // Update progress bar
            const percent = Math.round(progress * 100)
            document.getElementById('progressFill').style.width = `${percent}%`
            document.getElementById('progressText').textContent = `${percent}% (${data.eventIndex + 1}/${data.totalEvents})`

            // Update piano visualization for playback
            if (event.type === 'noteon' && event.velocity > 0) {
                activateNote(event.note, true)
            } else if (event.type === 'noteoff' || (event.type === 'noteon' && event.velocity === 0)) {
                deactivateNote(event.note, true)
            }

            if (data.sessionStart != null && data.sessionEnd != null) {
                playbackActive = true
                playbackTime = event.timestamp
                drawTimeline()
            }

            })

                        // Timeline zoom and pan controls
                        const btnZoomIn = document.getElementById('timelineZoomIn')
                        const btnZoomOut = document.getElementById('timelineZoomOut')
                        const btnPanLeft = document.getElementById('timelinePanLeft')
                        const btnPanRight = document.getElementById('timelinePanRight')
                        const btnResumeAuto = document.getElementById('timelineResumeAuto')
                        let customZoom = false

                        btnZoomIn.addEventListener('click', async function () {
                            if (window.selectedTimeRange) {
                                timelineStartTime = window.selectedTimeRange.start
                                timelineEndTime = window.selectedTimeRange.end
                                await ensureTimelineDataCovers(timelineStartTime, timelineEndTime)
                                updateTimeLabels()
                                drawTimeline()
                                // Reset selection as it's no longer valid
                                selectionStart = null
                                selectionEnd = null
                                updateSelection()
                                customZoom = true
                                btnResumeAuto.style.display = ''
                            }
                        })

                        btnZoomOut.addEventListener('click', async function () {
                            // Zoom out to double the current range, centered on selection if present, else center
                            let center, range
                            if (window.selectedTimeRange) {
                                center = (window.selectedTimeRange.start + window.selectedTimeRange.end) / 2
                                range = (window.selectedTimeRange.end - window.selectedTimeRange.start)
                            } else {
                                center = (timelineStartTime + timelineEndTime) / 2
                                range = (timelineEndTime - timelineStartTime)
                            }
                            range = Math.max(1000, range * 2)
                            timelineStartTime = Math.max(0, Math.round(center - range / 2))
                            timelineEndTime = Math.round(center + range / 2)
                            await ensureTimelineDataCovers(timelineStartTime, timelineEndTime)
                            updateTimeLabels()
                            drawTimeline()
                            customZoom = true
                            btnResumeAuto.style.display = ''
                        })

                        btnPanLeft.addEventListener('click', async function () {
                            // Pan left by 1/4 of current range
                            const range = timelineEndTime - timelineStartTime
                            const shift = Math.round(range / 4)
                            timelineStartTime = Math.max(0, timelineStartTime - shift)
                            timelineEndTime = timelineEndTime - shift
                            await ensureTimelineDataCovers(timelineStartTime, timelineEndTime)
                            updateTimeLabels()
                            drawTimeline()
                            customZoom = true
                            btnResumeAuto.style.display = ''
                        })

                        btnPanRight.addEventListener('click', async function () {
                            // Pan right by 1/4 of current range
                            const range = timelineEndTime - timelineStartTime
                            const shift = Math.round(range / 4)
                            timelineStartTime = timelineStartTime + shift
                            timelineEndTime = timelineEndTime + shift
                            await ensureTimelineDataCovers(timelineStartTime, timelineEndTime)
                            updateTimeLabels()
                            drawTimeline()
                            customZoom = true
                            btnResumeAuto.style.display = ''
                        })

                        btnResumeAuto.addEventListener('click', function () {
                            customZoom = false
                            btnResumeAuto.style.display = 'none'
                            loadTimelineData()
                        })

        // Initialize
        connect()
        loadSessions()
        loadOutputs()
    </script>
</body>

</html>
