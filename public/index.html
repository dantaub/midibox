<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidiBox</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }

        header {
            background: #16213e;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e94560;
        }

        h1 {
            font-size: 1.5rem;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.connected {
            background: #4caf50;
        }

        .status-dot.recording {
            background: #e94560;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        main {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            padding: 1rem;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        @media (min-width: 900px) {
            main {
                grid-template-columns: 1fr 320px;
            }
        }

        .primary {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-height: 0;
            overflow: hidden;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
        }

        .card {
            background: #16213e;
            border-radius: 8px;
            padding: 1rem;
            flex-shrink: 0;
        }

        .card.flex-grow {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .card h2 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: #e94560;
        }

        /* Piano visualization */
        .piano-container {
            overflow-x: auto;
            padding: 0.5rem 0;
        }

        .piano {
            display: flex;
            position: relative;
            height: 100px;
        }

        .white-key {
            width: 18px;
            min-width: 18px;
            height: 100%;
            background: linear-gradient(to bottom, #fff 0%, #e8e8e8 100%);
            border: 1px solid #999;
            border-radius: 0 0 3px 3px;
            transition: background 0.1s;
            cursor: pointer;
            user-select: none;
        }

        .white-key.active {
            background: linear-gradient(to bottom, #e94560 0%, #c73e54 100%);
        }

        .black-key {
            position: absolute;
            width: 12px;
            height: 60px;
            background: linear-gradient(to bottom, #333 0%, #000 100%);
            border-radius: 0 0 2px 2px;
            z-index: 1;
            transition: background 0.1s;
            cursor: pointer;
            user-select: none;
        }

        .black-key.active {
            background: linear-gradient(to bottom, #e94560 0%, #a83248 100%);
        }

        /* Event log */
        .event-log {
            flex: 1;
            overflow-y: auto;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.8rem;
        }

        .event {
            padding: 0.2rem 0.5rem;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            gap: 0.75rem;
        }

        .event-time {
            color: #666;
            min-width: 80px;
        }

        .event-type {
            color: #e94560;
            min-width: 70px;
        }

        .event-note {
            color: #4caf50;
        }

        .event-vel {
            color: #2196f3;
        }

        /* Sessions panel */
        .session-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .session-form input {
            padding: 0.5rem;
            border: none;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
        }

        .session-form button {
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            background: #e94560;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .session-form button:hover {
            background: #c73e54;
        }

        .session-list {
            margin-top: 1rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .session-item {
            padding: 0.5rem;
            background: #1a1a2e;
            border-radius: 4px;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }

        .session-item:hover {
            background: #252550;
        }

        .session-item.selected {
            background: #e94560;
        }

        .session-item .title {
            font-weight: bold;
        }

        .session-item .meta {
            font-size: 0.8rem;
            color: #888;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            flex-direction: column;
        }

        .control-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: #e94560;
            color: white;
        }

        .btn-secondary {
            background: #333;
            color: white;
        }

        .btn-stop {
            background: #ff6b6b;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        select {
            padding: 0.5rem;
            border: none;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
            flex: 1;
        }

        /* Progress bar */
        .progress-container {
            margin-top: 0.75rem;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            height: 8px;
            background: #1a1a2e;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #4caf50);
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-text {
            font-size: 0.75rem;
            color: #888;
            margin-top: 0.25rem;
            text-align: center;
        }

        /* Playback indicator on piano */
        .white-key.playback {
            background: linear-gradient(to bottom, #4caf50 0%, #388e3c 100%);
        }

        .black-key.playback {
            background: linear-gradient(to bottom, #4caf50 0%, #2e7d32 100%);
        }
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <header>
        <h1>🎹 MidiBox</h1>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </header>

    <main>
        <div class="primary">
            <div class="card">
                <h2>Live Piano</h2>
                <div class="piano-container">
                    <div class="piano" id="piano"></div>
                </div>
            </div>

            <div class="card flex-grow">
                <h2>Event Log</h2>
                <div class="event-log" id="eventLog"></div>
            </div>
        </div>

        <div class="sidebar">
            <div class="card">
                <h2>Save Session</h2>
                <form class="session-form" id="sessionForm">
                    <input type="text" name="performer" placeholder="Performer name">
                    <input type="text" name="song" placeholder="Song name">
                    <input type="number" name="minutes" placeholder="Last N minutes" value="5">
                    <button type="submit">Save Session</button>
                </form>
            </div>

            <div class="card">
                <h2>Sessions</h2>
                <div class="session-list" id="sessionList"></div>
            </div>

            <div class="card">
                <h2>Playback</h2>
                <div class="controls">
                    <div class="control-row">
                        <label style="font-size: 0.85rem; color: #888;">Output:</label>
                        <select id="outputSelect">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="control-row">
                        <button class="btn btn-primary" id="btnPlayback">▶ Play</button>
                        <button class="btn btn-stop" id="btnStop" disabled>⏹ Stop</button>
                    </div>
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-text" id="progressText">0%</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>MIDI File</h2>
                <div class="controls">
                    <input type="file" id="midiFileInput" accept=".mid,.midi" style="display: none;">
                    <button class="btn btn-secondary" id="btnSelectFile">📁 Select File</button>
                    <div id="fileInfo" style="font-size: 0.85rem; color: #888; margin-top: 0.5rem;"></div>
                    <button class="btn btn-primary" id="btnPlayFile" disabled style="margin-top: 0.5rem;">▶ Play File</button>
                </div>
            </div>

            <div class="card">
                <h2>MIDI</h2>
                <div class="controls">
                    <button class="btn btn-secondary" id="btnRefresh">Refresh Devices</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Piano keyboard setup
        const piano = document.getElementById('piano')
        const eventLog = document.getElementById('eventLog')
        const statusDot = document.getElementById('statusDot')
        const statusText = document.getElementById('statusText')

        // Note names for display
        const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B']
        const blackKeyOffsets = [1, 2, 4, 5, 6] // Which white keys have black keys after them (0-indexed within octave)

        function noteName(note) {
            const octave = Math.floor(note / 12) - 1
            const name = noteNames[note % 12]
            return `${name}${octave}`
        }

                // Build piano - full 88-key range (A0 to C8)
                const startNote = 21 // A0 (lowest on 88-key piano)
                const endNote = 108  // C8 (highest on 88-key piano)
        const keys = {}

        let whiteKeyIndex = 0
        for (let note = startNote; note <= endNote; note++) {
            const noteInOctave = note % 12
            const isBlack = [1, 3, 6, 8, 10].includes(noteInOctave)

            const key = document.createElement('div')
            key.dataset.note = note

            if (isBlack) {
                key.className = 'black-key'
                key.style.left = `${(whiteKeyIndex * 18) - 6}px`
            } else {
                key.className = 'white-key'
                whiteKeyIndex++
            }

            keys[note] = key
            piano.appendChild(key)
        }

                // Click/touch to play notes
                const pressedKeys = new Set()

                function sendNoteOn(note) {
                    if (ws && ws.readyState === WebSocket.OPEN && !pressedKeys.has(note)) {
                        pressedKeys.add(note)
                        ws.send(JSON.stringify({ type: 'playNote', note, velocity: 100, on: true }))
                        activateNote(note)
                    }
                }

                function sendNoteOff(note) {
                    if (ws && ws.readyState === WebSocket.OPEN && pressedKeys.has(note)) {
                        pressedKeys.delete(note)
                        ws.send(JSON.stringify({ type: 'playNote', note, on: false }))
                        deactivateNote(note)
                    }
                }

                // Mouse handlers
                piano.addEventListener('mousedown', (e) => {
                    const key = e.target.closest('.white-key, .black-key')
                    if (key) {
                        e.preventDefault()
                        sendNoteOn(parseInt(key.dataset.note))
                    }
                })

                document.addEventListener('mouseup', () => {
                    pressedKeys.forEach(note => sendNoteOff(note))
                })

                piano.addEventListener('mouseleave', () => {
                    pressedKeys.forEach(note => sendNoteOff(note))
                })

                piano.addEventListener('mouseover', (e) => {
                    if (e.buttons === 1) {
                        const key = e.target.closest('.white-key, .black-key')
                        if (key) {
                            const note = parseInt(key.dataset.note)
                            // Release other keys when dragging
                            pressedKeys.forEach(n => { if (n !== note) sendNoteOff(n) })
                            sendNoteOn(note)
                        }
                    }
                })

                // Touch handlers for mobile
                piano.addEventListener('touchstart', (e) => {
                    e.preventDefault()
                    for (const touch of e.changedTouches) {
                        const key = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.white-key, .black-key')
                        if (key) sendNoteOn(parseInt(key.dataset.note))
                    }
                }, { passive: false })

                piano.addEventListener('touchend', (e) => {
                    e.preventDefault()
                    for (const touch of e.changedTouches) {
                        const key = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.white-key, .black-key')
                        if (key) sendNoteOff(parseInt(key.dataset.note))
                    }
                }, { passive: false })

                piano.addEventListener('touchmove', (e) => {
                    e.preventDefault()
                    const currentNotes = new Set()
                    for (const touch of e.touches) {
                        const key = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.white-key, .black-key')
                        if (key) currentNotes.add(parseInt(key.dataset.note))
                    }
                    // Release notes no longer touched
                    pressedKeys.forEach(note => { if (!currentNotes.has(note)) sendNoteOff(note) })
                    // Press new notes
                    currentNotes.forEach(note => sendNoteOn(note))
                }, { passive: false })

        // Active notes tracking
        const activeNotes = new Set()
        let isPlaying = false
        const playbackNotes = new Set()

        function activateNote(note, isPlayback = false) {
            if (keys[note]) {
                if (isPlayback) {
                    keys[note].classList.add('playback')
                    playbackNotes.add(note)
                } else {
                    keys[note].classList.add('active')
                    activeNotes.add(note)
                }
            }
        }

        function deactivateNote(note, isPlayback = false) {
            if (keys[note]) {
                if (isPlayback) {
                    keys[note].classList.remove('playback')
                    playbackNotes.delete(note)
                } else {
                    keys[note].classList.remove('active')
                    activeNotes.delete(note)
                }
            }
        }

        function clearPlaybackNotes() {
            playbackNotes.forEach(note => {
                if (keys[note]) keys[note].classList.remove('playback')
            })
            playbackNotes.clear()
        }

        // Event log
        const maxLogEntries = 100

        function addLogEntry(event) {
            const entry = document.createElement('div')
            entry.className = 'event'

            const time = new Date(event.timestamp).toLocaleTimeString()
            let details = ''

            if (event.type === 'noteon' || event.type === 'noteoff') {
                details = `<span class="event-note">${noteName(event.note)}</span> <span class="event-vel">vel:${event.velocity}</span>`
            } else if (event.type === 'cc') {
                details = `CC${event.control} = ${event.value}`
            } else if (event.type === 'pitchbend') {
                details = `bend: ${event.value}`
            }

            entry.innerHTML = `
        <span class="event-time">${time}</span>
        <span class="event-type">${event.type}</span>
        ${details}
      `

            eventLog.insertBefore(entry, eventLog.firstChild)

            // Trim old entries
            while (eventLog.children.length > maxLogEntries) {
                eventLog.removeChild(eventLog.lastChild)
            }
        }

        // WebSocket connection
        let ws
        let reconnectTimeout

        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'
            ws = new WebSocket(`${protocol}//${location.host}/ws`)

            ws.onopen = () => {
                statusDot.className = 'status-dot connected recording'
                statusText.textContent = 'Recording'
                clearTimeout(reconnectTimeout)
            }

            ws.onclose = () => {
                statusDot.className = 'status-dot'
                statusText.textContent = 'Disconnected'
                reconnectTimeout = setTimeout(connect, 2000)
            }

            ws.onerror = () => {
                ws.close()
            }

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data)
                    if (data.type === 'midi') {
                        handleMidiEvent(data.event)
                    } else if (data.type === 'playback') {
                        handlePlaybackStatus(data)
                    } else if (data.type === 'playback-event') {
                        handlePlaybackEvent(data)
                    }
                } catch (err) {
                    console.error('WebSocket message error:', err)
                }
            }
        }

        function handleMidiEvent(event) {
            // Update piano visualization
            if (event.type === 'noteon' && event.velocity > 0) {
                activateNote(event.note, false)
            } else if (event.type === 'noteoff' || (event.type === 'noteon' && event.velocity === 0)) {
                deactivateNote(event.note, false)
            }

            // Add to log
            addLogEntry(event)
        }

        function handlePlaybackStatus(data) {
            const progressContainer = document.getElementById('progressContainer')
            const btnPlayback = document.getElementById('btnPlayback')
            const btnStop = document.getElementById('btnStop')

            if (data.status === 'started') {
                isPlaying = true
                progressContainer.classList.add('active')
                btnPlayback.disabled = true
                btnStop.disabled = false
            } else if (data.status === 'ended') {
                isPlaying = false
                progressContainer.classList.remove('active')
                btnPlayback.disabled = false
                btnStop.disabled = true
                clearPlaybackNotes()
                document.getElementById('progressFill').style.width = '0%'
                document.getElementById('progressText').textContent = 'Complete'
            }
        }

        function handlePlaybackEvent(data) {
            const event = data.event
            const progress = data.progress

            // Update progress bar
            const percent = Math.round(progress * 100)
            document.getElementById('progressFill').style.width = `${percent}%`
            document.getElementById('progressText').textContent = `${percent}% (${data.eventIndex + 1}/${data.totalEvents})`

            // Update piano visualization for playback
            if (event.type === 'noteon' && event.velocity > 0) {
                activateNote(event.note, true)
            } else if (event.type === 'noteoff' || (event.type === 'noteon' && event.velocity === 0)) {
                deactivateNote(event.note, true)
            }
        }

        // Session management
        const sessionForm = document.getElementById('sessionForm')
        const sessionList = document.getElementById('sessionList')

        sessionForm.addEventListener('submit', async (e) => {
            e.preventDefault()
            const form = new FormData(sessionForm)
            const minutes = parseInt(form.get('minutes')) || 5
            const now = Date.now()

            const session = {
                start_time: now - (minutes * 60 * 1000),
                end_time: now,
                performer: form.get('performer') || null,
                song_name: form.get('song') || null,
            }

            try {
                const res = await fetch('/api/sessions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(session),
                })

                if (res.ok) {
                    sessionForm.reset()
                    sessionForm.elements.minutes.value = '5'
                    loadSessions()
                }
            } catch (err) {
                console.error('Failed to save session:', err)
            }
        })

        async function loadSessions() {
            try {
                const res = await fetch('/api/sessions')
                const sessions = await res.json()

                sessionList.innerHTML = sessions.map(s => `
          <div class="session-item" data-start="${s.start_time}" data-end="${s.end_time}">
            <div class="title">${s.song_name || 'Untitled'}</div>
            <div class="meta">
              ${s.performer || 'Unknown'} · 
              ${new Date(s.start_time).toLocaleDateString()}
            </div>
          </div>
        `).join('')
            } catch (err) {
                console.error('Failed to load sessions:', err)
            }
        }

        // Controls
        document.getElementById('btnRefresh').addEventListener('click', async () => {
            try {
                await fetch('/api/midi/stop', { method: 'POST' })
                await fetch('/api/midi/start', { method: 'POST' })
                await loadOutputs()
            } catch (err) {
                console.error('Failed to refresh MIDI:', err)
            }
        })

        document.getElementById('btnPlayback').addEventListener('click', async () => {
            const selected = sessionList.querySelector('.session-item.selected')
            if (!selected) {
                alert('Select a session first')
                return
            }

            const outputSelect = document.getElementById('outputSelect')
            const output = outputSelect.value || undefined

            try {
                await fetch('/api/playback/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        start: parseInt(selected.dataset.start),
                        end: parseInt(selected.dataset.end),
                        output
                    }),
                })
            } catch (err) {
                console.error('Playback failed:', err)
            }
        })

        document.getElementById('btnStop').addEventListener('click', async () => {
            try {
                await fetch('/api/playback/stop', { method: 'POST' })
            } catch (err) {
                console.error('Stop failed:', err)
            }
        })

        async function loadOutputs() {
            const outputSelect = document.getElementById('outputSelect')
            try {
                const res = await fetch('/api/midi/outputs')
                const outputs = await res.json()

                if (outputs.length === 0) {
                    outputSelect.innerHTML = '<option value="">No outputs found</option>'
                } else {
                    outputSelect.innerHTML = outputs.map((o, i) => 
                        `<option value="${o}" ${i === 0 ? 'selected' : ''}>${o.split('/').pop()}</option>`
                    ).join('')
                }
            } catch (err) {
                outputSelect.innerHTML = '<option value="">Error loading outputs</option>'
            }
        }

        // Session selection
        sessionList.addEventListener('click', (e) => {
            const item = e.target.closest('.session-item')
            if (item) {
                sessionList.querySelectorAll('.session-item').forEach(i => {
                    i.classList.remove('selected')
                    i.style.background = ''
                })
                item.classList.add('selected')
            }
        })

            // MIDI file upload
            const midiFileInput = document.getElementById('midiFileInput')
            const btnSelectFile = document.getElementById('btnSelectFile')
            const btnPlayFile = document.getElementById('btnPlayFile')
            const fileInfo = document.getElementById('fileInfo')
            let selectedMidiFile = null

            btnSelectFile.addEventListener('click', () => midiFileInput.click())

            midiFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0]
                if (file) {
                    selectedMidiFile = file
                    fileInfo.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`
                    btnPlayFile.disabled = false
                }
            })

            btnPlayFile.addEventListener('click', async () => {
                if (!selectedMidiFile) return

                const output = outputSelect.value
                const formData = new FormData()
                formData.append('file', selectedMidiFile)
                if (output) formData.append('output', output)

                try {
                    btnPlayFile.disabled = true
                    btnPlayFile.textContent = '⏳ Loading...'

                    const res = await fetch('/api/playback/file', {
                        method: 'POST',
                        body: formData
                    })

                    const data = await res.json()
                    if (data.error) {
                        alert('Error: ' + data.error)
                    } else {
                        fileInfo.textContent = `Playing: ${data.fileName} (${data.eventCount} events)`
                    }
                } catch (err) {
                    alert('Failed to play file: ' + err.message)
                } finally {
                    btnPlayFile.textContent = '▶ Play File'
                    btnPlayFile.disabled = false
                }
            })

        // Initialize
        connect()
        loadSessions()
        loadOutputs()
    </script>
</body>

</html>
